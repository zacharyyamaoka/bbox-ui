# WHY this publishes by pushing a branch instead of actions/deploy-pages:
# the repo's Pages is configured build_type "legacy", serving the `gh-pages`
# branch at `/` (that is what is live today). `actions/deploy-pages` only works
# under build_type "workflow", so the artifact-upload form would fail on its
# first run, and switching the repo to "workflow" would take the live site down
# until a run completed. Building and pushing the bundle keeps one mechanism,
# matches what is already serving, and needs no repository setting changed.
name: Deploy Storybook to Pages

on:
  push:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # WHY a separate job instead of extra steps in build-and-publish: this gate
  # must run on every push (any branch) and every PR, but the publish job may
  # only ever run for `main` or workflow_dispatch (R13). Splitting them lets
  # the gate's trigger stay wide open while `build-and-publish`'s `if:` keeps
  # publishing narrow, without duplicating the trigger logic per step.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22  # pnpm 11 needs Node >= 22.13 (node:sqlite); CI was red on Node 20 from 2026-09-16
          cache: pnpm
      # magnetProvenance.test.ts (A12) existsSync's every donor file the magnet
      # kit cites. The donor is public; pin the commit its citations were
      # checked against (the eight files are byte-identical to the local
      # donor HEAD those headers were written from) so a later donor rename
      # fails here on purpose, not at random.
      - uses: actions/checkout@v4
        with:
          repository: zacharyyamaoka/systemsketch
          ref: 52ec958214ef7e93396db4b4f3911057df98e4a6
          path: .donors/systemsketch
      # apps/bbox-reactflow depends on simple-reactflow-whiteboard through a
      # committed symlink to the absolute worktree path in its package.json
      # (bboxUi.whiteboardPin), and whiteboardDependency.test.ts asserts that
      # worktree sits at the pinned commit with a built dist/. Recreate it at
      # exactly that path, from the manifest, BEFORE install (pnpm copies the
      # `file:` dep at install time); its `prepare` script builds dist/.
      - name: Materialize the pinned simple-reactflow-whiteboard worktree
        run: |
          PIN_DIR=$(jq -r .bboxUi.whiteboardPin.worktree apps/bbox-reactflow/package.json)
          PIN_SHA=$(jq -r .bboxUi.whiteboardPin.commit apps/bbox-reactflow/package.json)
          sudo mkdir -p "$(dirname "$PIN_DIR")"
          sudo chown "$(id -u):$(id -g)" "$(dirname "$PIN_DIR")"
          git clone -q https://github.com/zacharyyamaoka/simple-reactflow-whiteboard.git "$PIN_DIR"
          git -C "$PIN_DIR" checkout -q --detach "$PIN_SHA"
          pnpm --dir "$PIN_DIR" install --frozen-lockfile
          test -f "$PIN_DIR/dist/index.js"
      - run: pnpm install --frozen-lockfile
      # The `storybook` Vitest project runs every story in real Chromium. The
      # runner has no Playwright browser, so without this the project died at
      # launch ("Executable doesn't exist") and 178 story files never ran.
      - run: pnpm --filter bbox-storybook-basics exec playwright install --with-deps chromium
      # The text-ink stories (DetachToPrimitive F3) compare the live DOM's
      # system sans against tldraw's bundled font, with tolerances measured on
      # a box where sans-serif/system-ui resolve to Noto Sans. The runner has
      # no Noto and falls back to the wider DejaVu Sans, failing by <1 px.
      - run: sudo apt-get install -y --no-install-recommends fonts-noto-core && fc-match sans-serif
      - run: pnpm -r run typecheck
      # One package at a time: run in parallel, systemsketch's browser suite
      # starved packages/glyph-picker's jsdom tests (32 tests, 104 s) into
      # vitest's unhandled "Timeout calling onTaskUpdate" (LEDGER FLAKY_FILES).
      - run: pnpm -r --workspace-concurrency=1 run test
        env:
          SYSTEMSKETCH_DONOR_ROOT: ${{ github.workspace }}/.donors/systemsketch

  build-and-publish:
    needs: gate
    # `needs:` alone does not imply success() once this job declares its own
    # `if:` — omitting success() here would let a failed/skipped gate through
    # whenever the event-type check passed, i.e. a red tree would still
    # publish on every push to main. Both conditions are required.
    # PAUSED on Zach's instruction, 2026-09-11: "No need to continue
    # publishing to github io for now - you can launch the server locally, as
    # we were doing before." The work moved into the bbox-ui.com site's
    # /create page, which is prototyped locally.
    #
    # Deliberately NOT deleted, and deliberately still reachable by hand: the
    # gh-pages branch is still serving the last published build, so removing
    # this job would leave a live site with no way to update or take it down.
    # workflow_dispatch keeps that one lever. To resume automatic publishing,
    # put the push/main clause back into the condition below.
    if: >-
      success() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22  # pnpm 11 needs Node >= 22.13 (node:sqlite); CI was red on Node 20 from 2026-09-16
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter bbox-storybook run build-storybook
      - run: pnpm --filter demo-inspector run build
      # The T1 product inspector ships beside the Storybook, at /inspector/.
      # demos/port-inspector is T0's retired Port-only panel and is not published.
      - run: cp -r demos/inspector/dist apps/storybook/storybook-static/inspector
      # Storybook is a Vite bundle with `_`-prefixed asset paths; without this
      # GitHub runs it through Jekyll and those assets 404.
      - run: touch apps/storybook/storybook-static/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/storybook/storybook-static
          publish_branch: gh-pages
          force_orphan: true
